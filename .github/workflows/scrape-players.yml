name: Scrape Players

on:
  schedule:
    # Tuesday & Thursday 05:00 Europe/Madrid (CET = UTC+1).
    # During CEST (UTC+2) this runs at 06:00 local time.
    - cron: '0 4 * * 2'
    - cron: '0 4 * * 4'
  workflow_dispatch:

concurrency:
  group: scrape-players
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape players
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Prepare scrape
        uses: ./.github/actions/prepare-scrape
        with:
          turso_url: ${{ secrets.TURSO_URL }}
          turso_auth_token: ${{ secrets.TURSO_AUTH_TOKEN }}
          league_ids: ${{ vars.LEAGUE_IDS }}

      - name: Scrape players
        run: pnpm scrape:players
