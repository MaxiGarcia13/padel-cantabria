name: Scrape Results

on:
  schedule:
    # Monday afternoon Europe/Madrid — genders one hour apart.
    # 14:00 UTC = 15:00 CET / 16:00 CEST — masculine.
    # 15:00 UTC = 16:00 CET / 17:00 CEST — feminine.
    - cron: '0 14 * * 1'
    - cron: '0 15 * * 1'
  workflow_dispatch:
    inputs:
      genders:
        description: Comma-separated federation gender values (empty = all)
        required: false
        default: ''

concurrency:
  group: scrape-results
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape results
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Resolve gender filter
        id: gender
        env:
          DISPATCH_GENDERS: ${{ inputs.genders }}
          GENDERS_TUESDAY: ${{ vars.SCRAPE_GENDERS_TUESDAY }}
          GENDERS_WEDNESDAY: ${{ vars.SCRAPE_GENDERS_WEDNESDAY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "genders=${DISPATCH_GENDERS}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour="$(date -u +%H)"
          if [ "$hour" = "14" ]; then
            if [ -z "$GENDERS_TUESDAY" ]; then
              echo "SCRAPE_GENDERS_TUESDAY repo variable is not set" >&2
              exit 1
            fi
            echo "genders=${GENDERS_TUESDAY}" >> "$GITHUB_OUTPUT"
          elif [ "$hour" = "15" ]; then
            if [ -z "$GENDERS_WEDNESDAY" ]; then
              echo "SCRAPE_GENDERS_WEDNESDAY repo variable is not set" >&2
              exit 1
            fi
            echo "genders=${GENDERS_WEDNESDAY}" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected schedule hour: ${hour}" >&2
            exit 1
          fi

      - name: Prepare scrape
        uses: ./.github/actions/prepare-scrape
        with:
          turso_url: ${{ secrets.TURSO_URL }}
          turso_auth_token: ${{ secrets.TURSO_AUTH_TOKEN }}
          league_ids: ${{ vars.LEAGUE_IDS }}
          scrape_genders: ${{ steps.gender.outputs.genders }}

      - name: Scrape results
        run: pnpm scrape:results
