name: Scrape Teams

on:
  workflow_dispatch:

concurrency:
  group: scrape-teams
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape teams
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Prepare scrape
        uses: ./.github/actions/prepare-scrape
        with:
          turso_url: ${{ secrets.TURSO_URL }}
          turso_auth_token: ${{ secrets.TURSO_AUTH_TOKEN }}
          league_ids: ${{ vars.LEAGUE_IDS }}

      - name: Scrape teams
        run: pnpm scrape:teams
