services:
  - type: web
    name: padel-cantabria-assistant
    runtime: node
    plan: starter
    # Avoid corepack (EROFS) and npx/npm-in-repo (EBADDEVENGINES). Install pnpm under
    # ./.render-pnpm from /tmp so npm does not load this package.json; keep it for start.
    buildCommand: (cd /tmp && npm install -g pnpm@12.11.2 --prefix "$OLDPWD/.render-pnpm") && export PATH="$PWD/.render-pnpm/bin:$PATH" && pnpm install --frozen-lockfile && pnpm --filter @padel-cantabria/assistant build
    startCommand: export PATH="$PWD/.render-pnpm/bin:$PATH" && pnpm --filter @padel-cantabria/assistant start
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: LEAGUE_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPEN_ROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
